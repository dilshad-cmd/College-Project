<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(to right, #2c3e50, #4a6491);
            color: white;
            padding: 25px;
            text-align: center;
        }
        
        h2 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        
        .teacher-name {
            color: #ffd700;
            font-weight: 600;
        }
        
        .attendance-form {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }
        
        label {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
            display: block;
        }
        
        select, input[type="date"] {
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            min-width: 200px;
            transition: border 0.3s;
        }
        
        select:focus, input[type="date"]:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }
        
        .table-container {
            overflow-x: auto;
            margin: 25px 0;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }
        
        .attendance-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .attendance-table th {
            background-color: #3498db;
            color: white;
            padding: 15px 12px;
            text-align: left;
            font-weight: 600;
        }
        
        .attendance-table td {
            padding: 12px;
            border-bottom: 1px solid #e9ecef;
        }
        
        .attendance-table tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        
        .attendance-table tr:hover {
            background-color: #e3f2fd;
        }
        
        .roll-cell {
            font-weight: 600;
            color: #2c3e50;
            text-align: center;
            width: 80px;
        }
        
        .checkbox-cell {
            text-align: center;
            width: 100px;
        }
        
        input[type="checkbox"] {
            transform: scale(1.5);
            cursor: pointer;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background-color: #3498db;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background-color: #2c3e50;
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: #1a252f;
            transform: translateY(-2px);
        }
        
        .btn-success {
            background-color: #27ae60;
            color: white;
        }
        
        .btn-success:hover {
            background-color: #219653;
            transform: translateY(-2px);
        }
        
        .submit-btn {
            background: linear-gradient(to right, #27ae60, #2ecc71);
            color: white;
            padding: 15px 30px;
            font-size: 1.1rem;
            margin-top: 10px;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .container {
                border-radius: 10px;
            }
            
            .header {
                padding: 20px;
            }
            
            .attendance-form {
                padding: 20px;
            }
            
            .form-group {
                flex-direction: column;
                align-items: flex-start;
            }
            
            select, input[type="date"] {
                width: 100%;
            }
            
            .action-buttons {
                justify-content: center;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Attendance Taken by <span class="teacher-name">{{ teacher.name }}</span></h2>
        </div>
        

            {% csrf_token %}
            
            <div class="form-group">
                <div class="sel" style="margin: 10px;" >
                    <label for="subject">Select Subject:</label>
                    <select name="subject_id" id="subject" onchange="ReloadSubject(this.value)"  required>
                        {% for sub in subje %}
                            <option value="{{ sub.id }}"{% if sub.id|stringformat:"s" == request.GET.subject_id %}selected{% endif %}>{{ sub }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div class="table-container">
                <table class="attendance-table">
                    <thead>
                        <tr>
                            <th class="roll-cell">Roll No</th>
                            <th>Name</th>
                            <th>Subject</th>
                            <th>Date</th>
                            <th class="checkbox-cell">Present status</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% if data %}
                            {% for st in data %}
                            <tr>
                                <td class="roll-cell">{{ forloop.counter }}</td>
                                <td>{{ st.student }}</td>
                                <td>{{st.subj}}</td>
                                <td>{{st.date}}</td>
                                <td class="checkbox-cell">
                                    <input type="hidden" name="present_ids" value="{{ student.id }}">
                                    {{ st.status}}
                                </td>
                            </tr>
                            {% endfor %}
                        {% else %}
                            <tr>
                                <td colspan="4" style="text-align:center; color:gray; font-style:italic;">
                                    No students found for the selected subject.
                                </td>
                            </tr>
                        {% endif %}
                    </tbody>
                </table>
            </div>

    </div>

    <script>
    function ReloadSubject(subjectId){
        if (subjectId){
            window.location.href = `?subject_id=${subjectId}`;
        }else{
            window.location.href = window.location.pathname;
        }
    }

    </script>
</body>
</html>
